name: phy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dsp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg (codec survival test)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install numpy and pytest
        run: pip install --quiet numpy pytest

      - name: Run the PHY invariants
        working-directory: phy
        run: pytest -q -rs
